# Builds the Maven JAR, packages it in a container, and deploys it to Cloud Run.
# One-time GCP setup (service accounts, Workload Identity Federation, repo variables):
#   bash gcp/setup-cloud-run-cicd.sh PROJECT_ID [REGION]

name: Build and deploy to Cloud Run - Catoconsting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  SERVICE: catoconsting

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Select application JAR
        run: |
          shopt -s nullglob
          jars=()
          for f in target/*.jar; do
            case "$(basename "$f")" in
              *-sources.jar|*-javadoc.jar|*-tests.jar|original-*) continue ;;
            esac
            jars+=("$f")
          done
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one application JAR in target/, found: ${jars[*]:-none}"
            exit 1
          fi
          mkdir -p dist
          cp "${jars[0]}" dist/app.jar

      - name: Upload JAR for deploy job
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: dist/app.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write  # required for Workload Identity Federation
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/catoconsting/catoconsting:${{ github.sha }}

    steps:
      - name: Check repository variables
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -n "$PROJECT_ID" ]]   || missing+=(GCP_PROJECT_ID)
          [[ -n "$REGION" ]]       || missing+=(GCP_REGION)
          [[ -n "$WIF_PROVIDER" ]] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [[ -n "$DEPLOY_SA" ]]    || missing+=(GCP_DEPLOY_SERVICE_ACCOUNT)
          [[ -n "$RUNTIME_SA" ]]   || missing+=(GCP_RUNTIME_SERVICE_ACCOUNT)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing repository variables: ${missing[*]}. Run gcp/setup-cloud-run-cicd.sh and set the variables it prints."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: app-jar

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push container image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }} --allow-unauthenticated

      - name: Show service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
